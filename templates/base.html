<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block head %}{% endblock %}
    <title>{% block title %}{% endblock %} - ToKa Fitness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', path='/main.js') }}"></script>
</head>
<body data-bs-theme="light" onload="start()">
    <div id="navDiv">
        <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ToKa Fitness</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body mb-2 md:mb-0">
                <ul class="nav navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sessions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tracker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Community</a>
                    </li>
                </ul>
                <ul class="nav navbar-nav me-auto">
                    <li class="nav-item">
                        <form class="hstack gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
                        <button class="btn-solid btn-icon theme-secondary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                        </form>
                    </li>
                </ul>
                <ul class="nav navbar-nav">
                    <li class="nav-item">
                        <button class="nav-link" onclick="toggleTheme()">
                            <i class="bi bi-circle-half"></i>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                        <span class="avatar theme-primary">?</span>
                        </button>
                        <div class="menu">
                        <a class="menu-item" href="#">Login</a>
                        <a class="menu-item" href="#">Sign up</a>
                        <a class="menu-item" href="#">Pricing</a>
                        </div>
                    </li>
                </ul>
            </div>
            </dialog>
        </div>
        </nav>
    </div>
    <div id="contentDiv">
        {% block content %}{% endblock %}
    </div>
    <br />
    <div id="footerDiv">
        All rights reserved, Copyright "C" Toka Fitness.
        <ul>
            <li>
                <a href="/">home</a>
            </li>
        </ul>
    </div>
</body>
</html>

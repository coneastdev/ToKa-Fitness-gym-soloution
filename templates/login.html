{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block header %}
{% endblock %}

{% block content %}
<br />
<div class="container loginDiv">
    <form>
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="loginInputEmail" aria-describedby="emailHelp" placeholder="email@example.com" required>
        <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" id="loginInputPassword" placeholder="Password" required>
    </div>
    <div class="mb-3 form-field">
        <input type="checkbox" id="exampleCheck1" class="check" required>
        <label for="exampleCheck1">I agree to the Terms and Conditions</label>
    </div>
    <button type="submit" class="btn-solid theme-primary">Submit</button>
    </form>
</div>

{% endblock %}
